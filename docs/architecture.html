<style>

  .subtitle { color:var(--muted); font-size:14px; line-height:1.6; }
  .badges { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .badge {
    background:#fff; border:1px solid var(--line); border-radius:999px;
    padding:5px 11px; font-size:12px; color:#334155;
    box-shadow:0 2px 8px rgba(15,23,42,.04);
  }
  .badge strong { color:#0f172a; }
  .legend {
    display:flex; flex-wrap:wrap; gap:16px; align-items:center;
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:12px 16px; font-size:12px; color:#475569;
    box-shadow:0 4px 16px rgba(15,23,42,.04); white-space:nowrap;
  }
  .dot { width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:6px; vertical-align:-1px; }
  .dash { width:24px; border-top:2px dashed #94a3b8; display:inline-block; vertical-align:middle; margin-right:6px; }
  .canvas {
    margin-top:18px; background:#fff; border:1px solid var(--line);
    border-radius:22px; box-shadow:0 20px 55px rgba(15,23,42,.09);
    overflow-x:auto;
  }
  svg { display:block; width:100%; height:auto; min-width:1380px; }
  .node { transition: filter .15s ease, opacity .15s ease; }
  .node:hover { filter: drop-shadow(0 10px 18px rgba(15,23,42,.16)); }
  footer { margin-top:14px; color:#7b8798; font-size:12px; line-height:1.7; }
  @media (max-width:1100px) {
    .page { padding:22px 16px 30px; }
    .header { flex-direction:column; }
    h1 { font-size:24px; }
  }
  @media print {
    body { background:#fff; }
    .page { max-width:none; padding:0; }
    .canvas { box-shadow:none; border:none; }
    .legend, .badges { box-shadow:none; }
  }
