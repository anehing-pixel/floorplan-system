# ============================================================================
# CI 门禁：提交即构建，测试不过不允许合并
# ----------------------------------------------------------------------------
# 触发：push 到 master/main、以及针对 master/main 的 PR。
# 流程：checkout -> JDK17 -> mvn -q -B package（含全模块单测）-> 归档测试报告。
#
# 说明：
#   1. 仓库为多模块 Maven 工程（父 pom 聚合 14 个模块），在根目录执行
#      `mvn package` 即覆盖全部模块，无需逐模块调用。
#   2. `package` 生命周期默认包含 `test` 阶段，单测失败 -> Maven 非 0 退出
#      -> GitHub Actions job 失败 -> 该 PR 的 required check 无法通过。
#   3. 真正的“不能合并”依赖仓库设置中的 Branch protection rules：
#      Settings -> Branches -> Protect master -> Require status checks to pass
#      -> 勾选本工作流的 "构建与单元测试门禁 (build)"。
#      CI 文件本身无法强制分支保护，此项需 PM/仓库管理员一次性配置。
#   4. 静态检查（Checkstyle / SpotBugs / JaCoCo 覆盖率门禁）若要接入，
#      需在 pom.xml 增加插件与规则集配置——属 ENG 边界禁区，本次不改 pom，
#      方案见 docs/工程化配置模板.md「静态检查接入说明」。
# ============================================================================
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# 同一分支上重复推送时取消旧的运行，节省 runner 时间
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：仅需读取源码
permissions:
  contents: read

jobs:
  build:
    name: 构建与单元测试门禁
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 全模块构建与单元测试
        run: mvn -q -B package

      - name: 归档单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 14
